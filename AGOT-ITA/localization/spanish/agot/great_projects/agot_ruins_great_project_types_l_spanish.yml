 # Owner Success
 # scopes available: owner, onlooker, onlooker_2, project_location
agot_great_project_events.1000.t.base: "Grande Progetto"
agot_great_project_events.1000.t.ruins: "$agot_great_project_events.1000.t.base$: Restaurato [province.GetHolding.GetSpecialBuildingType.GetName]"
agot_great_project_events.1000.t.chroyane: "$agot_great_project_events.1000.t.base$: Restaurato [GetBuilding('agot_ruins_chroyane_walls_04').GetName]"
agot_great_project_events.1000.t.special: "$agot_great_project_events.1000.t.base$: Costruito [province.GetHolding.GetSpecialBuildingType.GetName]"
agot_great_project_events.1000.desc.ruins: "Osservo il [province.GetHolding.GetType.GetName|l], riportato al suo antico splendore. I lavoratori, ormai liberi dai propri obblighi, si disperdono, lasciandosi alle spalle una struttura splendida e robusta risorta dalle rovine.\n\nMi fermo per un momento ad ammirare questa nuova aggiunta al mio reame.\n\nSì, sì, andrà bene. Governerò con orgoglio su questo [province.GetHolding.GetType.GetName|l]."
agot_great_project_events.1000.desc.chroyane: "Osservo il [province.GetHolding.GetType.GetName|l], riportato al suo antico splendore. I lavoratori, ormai liberi dai propri obblighi, si disperdono, lasciandosi alle spalle una struttura splendida e robusta risorta dalle rovine.\n\nMi fermo per un momento ad ammirare questa nuova aggiunta al mio reame.\n\nSì, sì, andrà bene. Ma resta ancora molto lavoro da compiere per restaurare la città."
agot_great_project_events.1000.desc.special: "Osservo il [province.GetHolding.GetType.GetName|l], costruito ex novo. I lavoratori, ormai liberi dai propri obblighi, si disperdono, lasciandosi alle spalle una struttura splendida e robusta, un'imponente estensione della città.\n\nMi fermo per un momento ad ammirare questa nuova aggiunta al mio reame.\n\nSì, sì, andrà bene. Governerò con orgoglio su questo [province.GetHolding.GetType.GetName|l]."
agot_great_project_events.1000.a.ruins: "I progressi che stiamo compiendo sono straordinari."
agot_great_project_events.1000.a.chroyane: "Ciò che resta delle rovine attende i nostri sforzi."
agot_great_project_events.1000.a.special: "Lo splendore di questa città continua a crescere."

