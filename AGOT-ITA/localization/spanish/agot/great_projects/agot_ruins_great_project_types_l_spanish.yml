agot_great_project_events.1010.desc.ruins: "[Select_CString(overlord_scope.IsFemale,'La mia','Il mio')] [ROOT.Char.Custom2('RelationToMe', overlord_scope)], [overlord_scope.Custom('IT_NAM_COL3')][overlord_scope.GetTitledFirstName], ha mandato un emissario che mi si avvicina con entusiasmo di primo mattino.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" #EMP [Select_CString(envoy.IsFemale,'Lei','Lui')] riprende fiato e si inchina davanti a me.#! "Il restauro del [province.GetHolding.GetType.GetName|l] a [project_location.GetNameNoTooltip] è stato finalmente completato!"\n\n"[Select_CString(overlord_scope.IsFemale,'La nostra benevola','Il nostro benevolo')] [overlord_scope.Custom('IT_NAM_COL3')][overlord_scope.GetTitleAsNameNoTooltip] mi ha mandato qui per esprimervi il proprio apprezzamento per i vostri generosi contributi a quest'impresa!" [Select_CString(envoy.IsFemale,'La','Il')] [envoy.GetWomanMan] ha gli occhi ardenti di fervore mentre [Select_CString(envoy.IsFemale,'lei','lui')] racconta la visione dell'edificio restaurato, ricoprendo il [province.GetHolding.GetType.GetName|l] di innumerevoli descrizioni fantasiose.\n\nMormoro compiaciuto e annuisco, soddisfatto del mio contributo alla causa..."
