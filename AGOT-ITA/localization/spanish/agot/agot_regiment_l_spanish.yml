l_spanish:
 # Cultural MaA
  winter_wolves:0 "Lupi d'Inverno"
winter_wolves_flavor: 0 "#F In una terra dove la neve profonda persiste per anni, spesso è la fanteria pesante, più che la cavalleria, a decidere le sorti dello scontro, ma questi guerrieri del nord si trovano a proprio agio su qualsiasi campo di battaglia.#!"

  wolfswood_hunters:0 "Cacciatori della Foresta dei Lupi"
wolfswood_hunters_flavor: 0 "#F La vastità del Bosco dei Lupi ospita non soltanto animali selvatici, ma anche uomini che vivono cacciandoli. Sul campo di battaglia, costoro diventano astuti arcieri.#!"

  clan_champions:0 "Campioni del Clan"
clan_champions_flavor: 0 "#F Litigiosi per natura, i clan delle montagne del Nord sono in grado di schierare formidabili reggimenti di combattenti temprati.#!"

  barrow_knights:0 "Cavalieri della Tumulazione"
barrow_knights_flavor: 0 "#F Sebbene meno splendidamente corazzata delle proprie controparti meridionali, la cavalleria pesante delle Terre dei Tumuli può travolgere rapidamente qualunque formazione che non sia tra le più disciplinate.#!"

  unicorn_riders:0 "Cavalieri dell'Unicorno"
unicorn_riders_flavor: 0 "#F Ritenuti da molti più leggenda che realtà, gli unicorni di Skagos sono bestie dal passo sicuro, robuste quanto gli uomini che le cavalcano. Sul campo di battaglia sono uno spettacolo terrificante.#!"

  cape_watch:0 "Guardia del Capo"
cape_watch_flavor: 0 "#F Capo Kraken è da lungo tempo un campo di battaglia tra Uomini di Ferro e uomini del nord, e i suoi guerrieri attingono alle tradizioni marziali di entrambe le fazioni.#!"

  frog_spears:0 "Lance di rana"
frog_spears_flavor: 0 "#F Cacciando con la loro arma tradizionale, la lancia da rana, queste truppe leggermente armate rappresentano una minaccia per chiunque venga braccato da loro.#!"

  green_hand:0 "Cavalieri della Mano Verde"
green_hand_flavor: 0 "#F Ultimo residuo di un antico ordine fondato da un Re dell'Altopiano, questi cavalieri settentrionali impiegano la cavalleria e le tattiche del sud con effetti devastanti contro le formazioni di fanteria.#!"

bronze_cavalry:0 "Cavalleria di Bronzo"
bronze_cavalry_flavor: 0 "#F Fu con zoccoli e bronzo che i Primi Uomini conquistarono le Terre del Tramonto — e ancora una volta conquisteranno.#!"

  ironborn_reavers:0 "Predoni"
ironborn_reavers_flavor: 0 "#F Flagello delle coste di Westeros, questi temibili fanti pesanti rappresentano una grave minaccia per i soldati a piedi più leggermente armati.#!"

black_blood_cavalry:0 "Cavalleria di Sangue Nero"
black_blood_cavalry_flavor: 0 "#F Ora che gli Uomini di Ferro sono giunti nelle terre verdi, prendendo ciò che desiderano, non possono più fare affidamento sulle navi lunghe e sui razziatori come i loro consanguinei delle isole. Nelle terre verdi, il cavallo sarà la loro nave e la Cavalleria del Sangue Nero i loro razziatori.#!"

  royal_crossbowmen:0 "Balestrieri Reali"
royal_crossbowmen_flavor: 0 "#F Le balestre richiedono meno addestramento degli archi tradizionali, ma possono perforare con facilità persino le migliori armature, annullando il vantaggio della fanteria pesante e della cavalleria.#!"

marsh_walkers:0 "Camminatori della Palude"
marsh_walkers_flavor: 0 "#F Il fallimento dell'Invasione Andala nella conquista di Punta Chela Spezzata non fu dovuto soltanto al terreno difficile, ma anche ai guerrieri leggermente armati che seppero sfruttarlo. Questi reggimenti perpetuano quella tradizione di tattiche mordi e fuggi con grande efficacia.#!"

dragonguard:0 "Guardia del Drago"
dragonguard_flavor: 0 "#F La Guardia del Drago è composta da uomini pesantemente armati e corazzati, giurati al servizio della Casa Targaryen e degli altri signori Alto Valyriani del Mare Stretto.#!"

  sea_snakes:0 "Serpenti del Mare"
sea_snakes_flavor: 0 "#F Provenienti dalle isole della Baia delle Acque Nere e abituati al caos degli abbordaggi navali, la rapidità e l'aggressività di questi reggimenti li rendono efficaci tanto nell'inseguimento quanto nella ritirata.#!"

  winged_knights:0 "Cavalieri Alati"
winged_knights_flavor: 0 "#F Culla della cultura andala a Westeros, la Valle ospita una fiera tradizione cavalleresca le cui radici risalgono a millenni fa. I cavalieri della Valle sono pressoché inarrestabili contro le formazioni di fanteria.#!"

  finger_scouts:0 "Scout delle Dita"
finger_scouts_flavor: 0 "#F Sebbene la loro carica sia meno devastante di quella dei cavalieri più pesantemente corazzati, la velocità della cavalleria delle Dita la rende inestimabile per schermare le formazioni più lente e inseguire i nemici in rotta.#!"

  hunters_of_the_moon:0 "Cacciatori della Luna"
hunters_of_the_moon_flavor: 0 "#F Richiedendo ben poco equipaggiamento costoso, questi arcieri delle Montagne della Luna sono un'efficace risposta alla fanteria leggermente corazzata.#!"

  sistermen_pirates:0 "Pirati di Sistermen"
sistermen_pirates_flavor: 0 "#F Considerati pressoché ingovernabili, i pirati delle Tre Sorelle sono una forza agile e esasperante sul campo di battaglia.#!"

  summer_knights:0 "Cavalieri dell'Estate"
summer_knights_flavor: 0 "#F La cavalleria dell'Altopiano è uno spettacolo magnifico in tempo di pace e un nemico terrificante per la fanteria in tempo di guerra.#!"

  honeywine_quirrels:0 "Litigi di Honeywine"
honeywine_quirrels_flavor: 0 "#F I balestrieri dell'Altopiano sono particolarmente adatti a contrastare le armature a piastre dei cavalieri e della fanteria pesante, sebbene equipaggiarli sia più costoso rispetto ai semplici arcieri.#!"

  misty_shields:0 "Scudi Nebbiosi"
misty_shields_flavor: 0 "#F Provenienti dalle Isole Scudo, questi reggimenti sono temprati dalla battaglia contro i più temibili razziatori degli Uomini di Ferro e devono essere pronti a rispondere alle incursioni in qualsiasi momento.#!"

  arbor_marines:0 "Marinai di Arbor"
arbor_marines_flavor: 0 "#F Abituati a combattere a bordo delle navi della flotta Redwyne, questi reggimenti leggermente corazzati sono abili schermagliatori.#!"

  river_bows:0 "Arcieri Fluviali"
river_bows_flavor: 0 "#F Gli arcieri delle Terre dei Fiumi sono una forza leggera e agile, capace di reagire ai mutamenti sul campo di battaglia e punire le formazioni di fanteria nemiche per ogni passo falso.#!"

toll_collectors: 0 "Esattori dei Pedaggi"
toll_collectors_flavor: 0 "#F La Forca Verde è da lungo tempo una difesa fondamentale contro le minacce provenienti da nord e da est. Eppure, persino dinanzi a simili pericoli, si può ricavare moneta controllando i suoi pochi guadi e riscuotendo pedaggi da chiunque desideri attraversarli.#!"

knights_of_the_fool: 0 "Cavalieri del Giullare"
knights_of_the_fool_flavor: 0 "#F La più grande storia d'amore è quella di Florian e Jonquil, e questi cavalieri si consacrano a seguire l'esempio di Florian.#!"

ironbreakers: 0 "Spezzaferri"
ironbreakers_flavor: 0 "#F Da lungo tempo gli Uomini di Ferro sono una piaga per gli Uomini delle Terre dei Fiumi che dimorano sul Capo delle Aquile e lungo le rive della baia. Costoro hanno preso ad armarsi pesantemente quanto i predoni, così da spezzare gli stessi Uomini di Ferro.#!"

warlord_scouts: 0 "Esploratori dei Signori della Guerra"
warlord_scouts_flavor: 0 "#F Gli Uomini delle Terre dei Fiumi che vivono lungo l'alto corso delle Acque Nere e dei suoi affluenti fanno risalire il proprio diritto su queste terre alle antiche conquiste andale. Qui si insediarono diversi signori della guerra, e il loro impiego di esploratori perdura ancora oggi.#!"

willow_spears: 0 "Lance di Salice"
willow_spears_flavor: 0 "#F A est della Forca Verde, gli Uomini delle Terre dei Fiumi affrontano da lungo tempo le minacce provenienti dalle Montagne della Luna. Contro i clan dei Bruti e i Cavalieri della Valle, la lancia si è dimostrata un'arma affidabile attraverso i secoli.#!"

green_fishers: 0 "Pescatori Verdi"
green_fishers_flavor: 0 "#F Mentre l'Isola dei Volti rimane sotto la protezione degli Uomini Verdi, l'Occhio degli Dei è aperto a tutti. Gli Uomini delle Terre dei Fiumi ne pescano regolarmente le acque e restano vigili contro le minacce provenienti dalle Acque Nere.#!"

  storm_knights:0 "Cavalieri della Tempesta"
storm_knights_flavor: 0 "#F Come il tuono da cui prende il nome la loro patria, i cavalieri delle Terre della Tempesta fanno tremare la terra e gli uomini quando partono alla carica.#!"

sapphire_scouts: 0 "Esploratori dello Zaffiro"
sapphire_scouts_flavor: 0 "#F Facendo risalire la propria discendenza agli antichi Andali, gli uomini dell'Isola dello Zaffiro equipaggiano i propri guerrieri con cavalli e destrieri, rinunciando però alle armature pesanti per poter essere trasportati più agevolmente via mare.#!"

kingswood_spears: 0 "Lance del Bosco del Re"
kingswood_spears_flavor: 0 "#F Il Bosco del Re domina le Terre della Tempesta settentrionali, dove i suoi alberi imponenti offrono riparo e legname in abbondanza con cui fabbricare lance robuste e diritte.#!"

abulu_spears: 0 "Lance di Abulu"
abulu_spears_flavor: 0 "#F Quando Nymeria abbandonò le Isole dell'Estate, non tutti i Rhoynar partirono, e coloro che rimasero scoprirono che il loro uso della lancia si adattava bene allo stile di combattimento degli isolani dell'Estate.#!"

weeping_sailors: 0 "Marinai Piangenti"
weeping_sailors_flavor: 0 "#F Capo Furore e il Bosco della Pioggia sono davvero all'altezza dei loro nomi, poiché le tempeste che colpiscono la penisola sono terribili e violente. Sono state la morte di molti marinai, che partecipano a così tanti funerali che si dice siano costantemente in lacrime.#!"

milk_eye_archers: 0 "Arcieri Occhio di Latte"
milk_eye_archers_flavor: 0 "#F Gli uomini dell'Uncino hanno alle spalle una lunga storia turbolenta, combattendo spesso contro i loro stessi compatrioti delle Terre della Tempesta. Sono divenuti abili con l'arco, soprattutto in mare.#!"

vulture_killers: 0 "Uccisori di Avvoltoi"
vulture_killers_flavor: 0 "#F Gli uomini delle Terre Basse di Dorne combattono da generazioni contro i loro nemici oltre le Montagne Rosse. Da lungo tempo quegli avvoltoi depredano le terre e il popolo delle Terre Basse di Dorne, e l'unico destino che meritano è la lama.#!"

feathered_blades: 0 "Lame Piumate"
feathered_blades_flavor: 0 "#F Gli uomini delle Terre Basse di Dorne delle Terre della Tempesta sono da lungo tempo rinomati per i loro spadaccini e per le piume con cui adornano le guardie delle loro spade.#!"

hunters_of_the_horn: 0 "Cacciatori del Corno"
hunters_of_the_horn_flavor: 0 "#F Gli uomini delle Terre Basse di Dorne dell'Altopiano sono da lungo tempo rinomati cacciatori. Sebbene rinuncino all'arco in favore della spada e della cotta di maglia, non sono meno spietati nell'inseguimento.#!"

rain_bringers:0 "Portatori di Pioggia"
rain_bringers_flavor: 0 "#F Considerata da alcuni un'arma disonorevole, la balestra non suscita alcuno scrupolo negli uomini delle Terre dell'Occidente, che la impiegano sul campo di battaglia — e altrove.#!"

fair_isle_seamen: 0 "Marinai dell'Isola Bella"
fair_isle_seamen_flavor: 0 "#F Gli uomini dell'Isola Bella combattono da lungo tempo non soltanto contro il mare, ma anche contro gli Uomini di Ferro che infestano le sue acque. Preferendo spesso la velocità alla forza, questi marinai proteggono la propria terra.#!"

silver_scouts: 0 "Esploratori d'Argento"
silver_scouts_flavor: 0 "#F Spesso baluardo contro l'Altopiano a sud, gli uomini dell'Occidente della Marca Verde hanno perfezionato l'arte della ricognizione contro i propri nemici.#!"

ash_spears: 0 "Lance di Frassino"
ash_spears_flavor: 0 "#F Negli altopiani delle Terre dell'Occidente, gli alberi crescono alti e robusti, e i frassini sono particolarmente apprezzati per il loro legno resistente. Le lance ricavate dal frassino si sono dimostrate solide e affidabili, diventando un'arma prediletta dagli uomini dell'Occidente.#!"

  greenblood_oars:0 "Remi del Sangue Verde"
greenblood_oars_flavor: 0 "#F Pur conducendo un'esistenza misera a bordo di zattere sul Sangueverde, questi guerrieri custodiscono con orgoglio il ricordo dei loro antichi antenati rhoynar.#!"

  sun_spears:0 "Lance del Sole"
sun_spears_flavor: 0 "#F Le inflessibili lance di Dorne rappresentano un nemico ostinato e pericoloso per ogni sorta di cavalleria, leggera o pesante — persino per gli elefanti.#!"

  sand_steeds:0 "Cavalli di Sabbia"
sand_steeds_flavor: 0 "#F Celebri per la loro bellezza ed eleganza, i destrieri della sabbia di Dorne sono tra i cavalli più veloci al mondo, ma la loro resistenza non è meno impressionante. In battaglia, la cavalleria leggera degli uomini di Dorne non ha eguali nell'aggirare e inseguire i nemici più lenti.#!"

  pass_pikes:0 "Picche di Passo"
pass_pikes_flavor: 0 "#F Discendenti degli uomini di Dorne che difesero i passi montani contro le invasioni Targaryen per oltre un secolo, questi guerrieri si oppongono fieramente a ogni forma di cavalleria.#!"

  she_bears:0 "Orse"
she_bears_flavor: 0 "#F Le donne dell'Isola dell'Orso sono divenute robuste e temprate rispetto alle loro controparti della terraferma — e sono più che capaci di spaccare in due il cranio di un Uomo di Ferro.#!"

  stolen_spears:0 "Lance Rubate"
stolen_spears_flavor: 0 "#F Sebbene equipaggiati in modo più rudimentale rispetto ai soldati delle pianure, i lancieri dei clan montani provano grande piacere nell'infilzare i cavalli dei loro odiati nemici andali.#!"

  bronze_raiders:0 "Predoni di Bronzo"
bronze_raiders_flavor: 0 "#F Provenienti dalla rude tundra della Valle dei Thenn, i Razziatori di Bronzo sono tra i pochi soldati Bruti a utilizzare armi di metallo forgiate localmente. Oltre al loro impressionante armamento, i Razziatori di Bronzo sono temibili in battaglia — tra i pochi fanti pesanti che si trovano a nord della Bariera.#!"

sons_of_gendel:0 "Figli di Gendel"
sons_of_gendel_flavor: 0 "#F Quando Gorne e Gendel invasero il Nord, non tutti i loro uomini riuscirono a tornare in superficie. Molti rimasero invece sotto terra, e i più letali tra i loro guerrieri si fanno ora chiamare Figli di Gendel.#!"

fire_flingers:0 "Lanciatori di Fuoco"
fire_flingers_flavor: 0 "#F Vivere tra le Zanne del Gelo è una lotta quotidiana contro la morte, e il fuoco è un'arma fondamentale. Eppure il fuoco non viene usato soltanto contro gli elementi, ma anche contro gli altri uomini e per distruggere i loro accampamenti.#!"

cannibal_bows:0 "Archi Cannibali"
cannibal_bows_flavor: 0 "#F I Clan del Fiume di Ghiaccio sono temuti in tutto l'estremo nord per le loro tendenze cannibali, e i loro arcieri sono abili nell'immobilizzare i futuri pasti senza ucciderli.#!"

bat_catchers:0 "Acchiappapipistrelli"
bat_catchers_flavor: 0 "#F I guerrieri dei Corridori Notturni si addestrano fin dall'infanzia catturando pipistrelli di notte, imparando a muoversi silenziosamente e rapidamente, tanto che le altre tribù li chiamano Acchiappapipistrelli.#!"

wildling_raiders:0 "Razziatori Bruti"
wildling_raiders_flavor: 0 "#F Oltre la Bariera, la vita è dura e la terra è gelida. Per sopravvivere, gli uomini razziano gli uni gli altri in cerca di cibo, armi e persino mogli. Per i Bruti, razziare è vivere.#!"

dogsled_chariots:0 "Carri a slitta trainati da cani"
dogsled_chariots_flavor: 0 "#F Sulla Costa Gelata, tribù e uomini usano slitte trainate da cani, proprio come gli uomini dell'est usano i carri. Sulle distese di ghiaccio e sulle colline innevate, non esiste minaccia più grande.#!"

black_soles:0 "Suole Nere"
black_soles_flavor: 0 "#F I Piedicorno sono celebri oltre la Bariera per non indossare calzature. I loro piedi anneriscono per il congelamento, temprandoli e rendendoli combattenti forti, freddi e inflessibili.#!"

ice_skatters:0 "Pattinatori del Ghiaccio"
ice_skatters_flavor: 0 "#F Molto a nord, oltre la Foresta Stregata, sui grandi laghi ghiacciati, gli uomini combattono sopra immense distese di ghiaccio. Si dice che indossino lame di metallo o d'osso ai piedi, che permettono loro di volare sul ghiaccio.#!"

cairn_wardens:0 "Custodi dei Tumuli"
cairn_wardens_flavor: 0 "#F Poche cose uniscono i Bruti oltre la Bariera, ma una di queste è la comune venerazione per i tumuli dei loro re ed eroi nella Valle dell'Acqua Bianca. Coloro che osano disonorare i morti vengono puniti dai Custodi dei Tumuli.#!"

purple_marines:0 "Marine Purpurei"
purple_marines_flavor: 0 "#F Braavos è la seconda maggiore potenza tra le Città Libere, e la principale fonte della sua forza è la marina. Le vele purpuree, tinte con i molluschi trovati nella laguna, trasportano i fanti di marina della città attraverso i mari.#!"

  indentured_legion:0 "Legione Contrattuale"
indentured_legion_flavor: 0 "#F Schiavizzate in tutto fuorché nel nome, le 'legioni' di schermagliatori di Pentos sono prive d'ispirazione e motivazione, e servono soltanto perché non possono permettersi di non farlo.#!"

  sun_guard:0 "Guardia del Sole"
sun_guard_flavor: 0 "#F La guardia di Essari, la Città Libera perduta. Ora che la città è stata ricostruita ed è tornata a vivere, la luce del sole risplende sugli scudi dorati della Guardia del Sole.#!"

  moroshi_pikes:0 "Picche di Moroshi"
moroshi_pikes_flavor: 0 "#F Nonostante sia la più piccola e spesso dimenticata delle Città Libere, Lorath mantiene una forte guardia a protezione delle proprie colonie e dei propri alleati alla foce del Sarne. Laddove altre città pagano i Dothraki perché si allontanino, Lorath ha dovuto difendere Morosh con lance e picche.#!"

  stair_guard:0 "Guardia delle Scale"
stair_guard_flavor: 0 "#F Spesso trascurata in favore della Guardia Sacra dei Preti Barbuti, la guardia cittadina di Norvos prende il nome dalla grande scalinata che collega la città bassa e quella alta di Norvos, chiamata dagli abitanti Gradini dei Peccatori.#!"

  cohort_of_the_three_thousand:0 "Coorte dei Tremila"
cohort_of_the_three_thousand_flavor: 0 "#F Quando Qohor fu minacciata dalle orde dell'Est, non furono le compagnie libere, le leve locali e neppure gli alleati delle Città Libere a salvarla. No — furono tremila soldati schiavi di Astapor, gli Immacolati, a respingere per diciotto volte i signori dei cavalli. Da allora, i Tremila proteggono la città.#!"

  disputant_scouts:0 "Esploratori delle Terre Contese"
disputant_scouts_flavor: 0 "#F Un tempo granaio della grande Fortezza Franca di Valyria, la regione oggi conosciuta come Terre Contese ospita il popolo Hartalari. Abituati a evitare i grandi eserciti delle Tre Figlie, i loro esploratori sono rapidi e silenziosi.#!"

  weeping_guard:0 "Guardia del Pianto"
weeping_guard_flavor: 0 "#F Gli uomini liberi di Lys considerano armi e armature indegne di loro, e così la Guardia Piangente garantisce la sicurezza della città — schiavi armati con armi esotiche e impiegati come fanteria pesante, giurati a proteggere Lys la Bella.#!"

  myrish_crossbows:0 "Balestrieri di Myr"
myrish_crossbows_flavor: 0 "#F Sebbene considerate codarde da alcuni, le balestre usate dai Myriani sono semplici da maneggiare e devastanti in battaglia — permettendo loro di smentire simili accuse.#!"

  ornate_helms:0 "Elmi Ornati"
ornate_helms_flavor: 0 "#F Adornati con gli elaborati elmi della loro città madre, gli Elmi Ornati sono un'unità di picchieri celebre per i combattimenti nelle Terre Contese.#!"

  slave_legion:0 "Legioni di Schiavi"
slave_legion_flavor: 0 "#F La grande Fortezza Franca di Valyria fu edificata con magia del sangue e fuoco di drago — e sulle schiene degli schiavi. Laddove i cavalieri di draghi o i maghi del sangue non erano presenti direttamente, si trovavano le legioni schiave della Fortezza Franca.#!"

  tiger_cloaks:0 "Mantelli delle Tigri"
tiger_cloaks_flavor: 0 "#F Guardia di Volantis e dei suoi tributari, le Cappe di Tigre sono soldati schiavi votati a eseguire la volontà dei triarchi con le loro lance affilate e cotte di maglia d'argento.#!"

  black_wall_chariots:0 "Carri delle Mura Nere"
black_wall_chariots_flavor: 0 "#F Il Sangue Antico di Volantis si tiene separato dal resto della città e mostra la propria gloria con l'annuale corsa dei carri sulle Mura Nere — uno spettacolo che funge anche da addestramento per le loro micidiali macchine da guerra.#!"

  dragonsworn:0 "Giurati del Drago"
dragonsworn_flavor: 0 "#F Le tribù Senrilliane delle Montagne Dipinte sono un popolo feroce e selvaggio, e i loro più grandi guerrieri non sono da meno. Credendosi campioni di una delle loro divinità draconiche, inseguiranno qualsiasi nemico per abbatterlo con le loro grandi spade.#!"

  demon_guards:0 "Guardie Demoniache"
demon_guards_flavor: 0 "#F Gli abitanti di Mantarys sono molto simili alla terra che abitano — deformi e condannati. Le loro guardie sfruttano questa temibile reputazione a proprio vantaggio, indossando maschere grottesche e terrificanti.#!"

  elyrian_sailors:0 "Marinai di Elyria"
elyrian_sailors_flavor: 0 "#F I marinai di Elyria solcano non soltanto la Baia degli Schiavisti, ma anche le acque oltre di essa, trasportando spesso schiavi addestrati dalle città della baia a Lys e Volantis, per poi tornare con schiavi non addestrati e ripetere il ciclo.#!"

  tolosi_slingers:0 "Fiondatori di Tolos"
tolosi_slingers_flavor: 0 "#F I frombolieri di Tolos sono celebri in tutto Essos per la loro precisione letale. Si dice che potrebbero abbattere un drago colpendolo in entrambi gli occhi.#!"

  pit_fighters:0 "Combattenti dell'Arena"
pit_fighters_flavor: 0 "#F Le fosse da combattimento di Meereen sono rinomate in tutte le terre dell'Antico Impero, e i combattenti che ne emergono sono brutali e feroci.#!"

  collared_bows:0 "Archi Collari"
collared_bows_flavor: 0 "#F Yunkai non è nota per addestrare gli schiavi all'arte della guerra, eppure persino lì alcuni schiavi vengono addestrati a proteggere la città — seppur con gli archi.#!"

  unsullied:0 "Immacolati"
unsullied_flavor: 0 "#F Le legioni schiave di Astapor, gli Immacolati, rappresentano il tentativo della Città Rossa di ricreare le Legioni dal Passo Serrato di Grazdan e dell'Antico Impero.#!"

  lockstep_legion:0 "Legione del Passo Marcato"
lockstep_legion_flavor: 0 "#F L'Antico Impero di Ghis fu edificato da Grazdan il Grande e dalle sue Legioni dal Passo Serrato, la cui disciplina permise a Ghis di minacciare Valyria e i suoi draghi in numerose guerre.#!"

  iron_legion:0 "Legione di Ferro"
iron_legion_flavor: 0 "#F Laddove Astapor tentò di ricreare le Legioni dal Passo Serrato con gli schiavi, Nuova Ghis scelse di seguire gli insegnamenti di Grazdan impiegando uomini liberi — individui con un interesse concreto nella sopravvivenza della città — rendendo così le Legioni di Ferro leali e disciplinate.#!"

  star_carved:0 "Intagli Stellari"
star_carved_flavor: 0 "#F I guerrieri andali scendevano in battaglia con il ferro nelle mani e stelle incise sulla fronte per mostrare la loro fede nei Sette-Che-Sono-Uno.#!"

  qarlons_fallen:0 "I Caduti di Qarlon"
qarlons_fallen_flavor: 0 "#F Qarlon il Grande, ultimo dei re andali di Essos, guidò il proprio popolo in guerre e conquiste attraverso il nord di Essos. Ancora oggi gli Andalosi combattono secondo le tattiche e le tradizioni che egli insegnò loro.#!"

smiths_axes:0 "Asce del Fabbro"
smiths_axes_flavor: 0 "#F Non è chiaro se gli Andali dell'Ascia abbiano preso il proprio nome dall'arma o se sia stata l'arma a prendere il nome da loro, ma questi guerrieri prediligono le grandi asce alle spade.#!"

  mother_sworn:0 "Giurati della Madre"
mother_sworn_flavor: 0 "#F Coloro che vivono lungo il grande fiume Rhoyne giurano la propria vita alla Madre e la difenderanno fino all'ultimo respiro.#!"

  festival_guards:0 "Guardia del Festival"
festival_guards_flavor: 0 "#F Chroyane è celebre per le grandi feste celebrate durante tutto l'anno e in ogni parte della città, e le sue guardie — adornate con splendenti corazze d'acciaio ed elmi alti — sono uno spettacolo a loro volta.#!"

shrouded_guard:0 "Guardia Ammantata"
shrouded_guard_flavor: 0 "#F Gli Uomini di Pietra dei Dolori sono temuti lungo tutto il Rhoyne, poiché il loro tocco equivale a una condanna a morte.#!"

  flower_spears:0 "Lance Fiorite"
flower_spears_flavor: 0 "#F La città pallida sulla riva orientale del Rhoyne è nota per i suoi numerosi fiori ed è protetta da una forza celebre per le proprie lunghe lance, spesso adornate esse stesse di boccioli.#!"

  green_daggers:0 "Pugnali Verdi"
green_daggers_flavor: 0 "#F Ar Noy, situata lungo il Qhoyne, è nota per le sue torri e mura di marmo verde. I suoi marinai pattugliano il Qhoyne e il Lago del Pugnale, dal quale prendono il nome.#!"

  garden_guard:0 "Guardia del Giardino"
garden_guard_flavor: 0 "#F Il grande porto rhoynar di Sarhoy, alla foce del Fiume Madre, era protetto dalla sua Guardia del Giardino, così chiamata per i celebri giardini d'acqua salata della città.#!"

  grey_spears:0 "Lance Grigie"
grey_spears_flavor: 0 "#F Ny Sar vanta una lunga storia militare, più di qualsiasi altra città rhoynar. Fu il Principe Garris il Grigio a scacciare gli Uomini Pelosi dal Noyne, e la guardia cittadina prese il proprio nome da lui.#!"

  market_guard:0 "Guardia del Mercato"
market_guard_flavor: 0 "#F La tratta degli schiavi ha portato immense ricchezze alle città ghiscari, e nessuna ne ha beneficiato più di Hazdahn Mo. Tuttavia, gli animi dei mercanti rivali si infiammano spesso e la minaccia di una rivolta degli schiavi è sempre presente — da qui la necessità della Guardia del Mercato.#!"

  skahazdahn_wardens:0 "Custodi di Skahazadhan"
skahazdahn_wardens_flavor: 0 "#F Il Fiume Skahazadhan collega il cuore di Ghis ai suoi remoti avamposti nelle grandi pianure. Deve essere pattugliato e protetto, poiché gli schiavi provenienti dalle pianure devono essere inviati alla baia per l'addestramento o la vendita.#!"

dothraki_archers:0 "Arcieri Dothraki"
dothraki_archers_flavor: 0 "#F A cavallo come tutti i guerrieri dei khalasar, gli arcieri dothraki possiedono una precisione infallibile. Hanno portato rovina a innumerevoli eserciti, città e regni.#!"

shepherds:0 "Pastori"
shepherds_flavor: 0 "#F Proprio come i pastori proteggono le proprie greggi, così questi uomini difendono i Lhazareen dai pericoli del mondo esterno.#!"

tribute_guards:0 "Guardie del Tributo"
tribute_guards_flavor: 0 "#F Gran parte del successo di Omber dipende dai tributi che vengono versati — tanto gli uni agli altri quanto alle minacce esterne — e pertanto queste offerte vengono protette a ogni costo.#!"

  sarsfield_horse_archers:0 "Arcieri a Cavallo di Sarsfield"
sarsfield_horse_archers_flavor: 0 "#F Questo seguito d'élite di arcieri a cavallo serve la Casa Sarsfield incarnandone il blasone — librandosi instancabilmente là dove il loro signore li scaglia.#!"

caravan_guards:0 "Guardie delle Carovane"
caravan_guards_flavor: 0 "#F Attraversare il Grande Mare d'Erba — persino i tratti abitati lungo il Sarne — non è impresa facile, e le carovane devono essere ben protette da chiunque tenti di assalirle.#!"

cymmeri_iron_shirts:0 "Giubbe di Ferro Cymmeri"
cymmeri_iron_shirts_flavor: 0 "#F Celebri per la loro maestria nella lavorazione del ferro e delle cotte di maglia che ne forgiano, i Cymmeri sono meglio protetti della maggior parte dei popoli nomadi del Grande Mare d'Erba.#!"

gipp_wicker_shields:0 "Scudi di Vimini Gipp"
gipp_wicker_shields_flavor: 0 "#F La velocità è spesso la risorsa più preziosa sul Grande Mare d'Erba. Sebbene combattano a piedi anziché a cavallo, gli scudi di vimini permettono a questi guerrieri di muoversi con straordinaria rapidità.#!"

zoqora_chariots:0 "Carri Zoqora"
zoqora_chariots_flavor: 0 "#F Gli Zoqora sono celebri per i loro grandi carri, che sfrecciano attraverso il Grande Mare d'Erba abbattendo chiunque osi frapporsi sul loro cammino.#!"

lake_wardens:0 "Guardiani del Lago"
lake_wardens_flavor: 0 "#F I Custodi del Lago della Palude di Goraez hanno giurato di proteggere sia la propria città sia il grande lago, uno degli ultimi resti del Mare d'Argento.#!"

library_guard:0 "Guardia della Biblioteca"
library_guard_flavor: 0 "#F La Guardia della Biblioteca di Sallosh è celebre per la propria incrollabile dedizione alla difesa del vasto e antico deposito di conoscenza della città.#!"

silver_shields:0 "Scudi d'Argento"
silver_shields_flavor: 0 "#F I celebri Scudi d'Argento della Città dei Soldati sono rinomati come i guerrieri più disciplinati e diligenti di tutto Sarnor.#!"

clan_raiders:0 "Razziatori dei Clan"
clan_raiders_flavor: 0 "#F Gli uomini rimasti intrappolati a nord della Barriera di Brandon furono tagliati fuori dalle terre più calde e mansuete, e i clan furono costretti a razziarsi l'un l'altro per sopravvivere.#!"

scythed_chariots:0 "Carri Falcati"
scythed_chariots_flavor: 0 "#F I Tagaez Fen, gli Uomini Alti di Sarnor, erano eredi di numerose antiche tradizioni. Conservarono l'uso dei grandi carri falcati, temuti in tutto il Grande Mare d'Erba.#!"

shining_cataphracts:0 "Catafratti Splendenti"
shining_cataphracts_flavor: 0 "#F I Catafratti Splendenti di Sathar si abbattono sui propri nemici come una cascata sulla pietra infranta.#!"

coin_collectors:0 "Raccoglitori di Monete"
coin_collectors_flavor: 0 "#F A Rathylar, la moneta è sovrana, e coloro che hanno il compito di riscuoterla affrontano spesso pericoli da ogni lato, rendendo necessarie le armi.#!"

temple_guardians:0 "Guardiani del Tempio"
temple_guardians_flavor: 0 "#F I guardiani dei templi di Kyth rimangono saldi nel loro sacro dovere di difendere le dimore degli dei.#!"

hill_runners:0 "Corridori delle Colline"
hill_runners_flavor: 0 "#F I Corridori delle Colline di Hornoth sono noti per la loro vigilanza, sorvegliando i domini e le terre della città.#!"

firstborne:0 "Primonati"
firstborne_flavor: 0 "#F Nella città di Sarys, è un onore per ogni cittadino primogenito prestare servizio sulle mura della città per difenderla.#!"

lastborne:0 "Ultimonati"
lastborne_flavor: 0 "#F In quanto ultima città dei Sarnori, i difensori di Saath si fanno chiamare Ultimogeniti, poiché sono gli ultimi a preservare l'antica eredità.#!"

ar_archers:0 "Arcieri Ar"
ar_archers_flavor: 0 "#F I Nonteloshi sono stretti tra Myr e Pentos, non soltanto geograficamente ma anche militarmente. Sebbene non possano produrre balestre in massa come i Myriani, sono comunque eccellenti arcieri.#!"

civic_guard:0 "Guardia Civica"
civic_guard_flavor: 0 "#F I Puri di Qarth non cavalcano cavalli come i barbari delle altre terre. Cavalcano invece cammelli, cavalcature di gran lunga superiori. Ciò ha garantito loro protezione e controllo sulla Regina delle Città sin dal loro arrivo in queste terre.#!"

pale_cavalry:0 "Cavalleria Pallida"
pale_cavalry_flavor: 0 "#F I Qaathi provenivano dalle pianure del nord. Come molti popoli di quella regione, erano rinomati per la loro abilità a cavallo, e attribuivano grande valore ai cavalli sabino.#!"

gate_sailors:0 "Marinai delle Porte"
gate_sailors_flavor: 0 "#F Situata appena all'interno delle Porte di Giada, Qal è stata spesso la roccaforte dalla quale Qarth ha difeso il proprio dominio sulle porte.#!"

port_guard:0 "Guardia del Porto"
port_guard_flavor: 0 "#F Gli Ibbenesi sono richiamati dal mare, e pertanto i loro principali insediamenti tendono a essere porti, grandi o piccoli che siano, rendendo le guardie portuali quanto di più vicino possiedano a soldati professionisti.#!"

mountain_spears:0 "Lance della Montagna"
mountain_spears_flavor: 0 "#F Gli Ibbenesi che si spingono nell'entroterra della loro isola devono affrontare orsi e altre minacce più spesso che uomini, e l'uso delle lance permette loro di tenere simili pericoli a distanza.#!"

sar_wardens:0 "Custodi di Sar"
sar_wardens_flavor: 0 "#F Dalle sue umili origini come colonia penale, Ib Sar è cresciuta, e i suoi difensori continuano a chiamarsi custodi.#!"

patriarchal_guard:0 "Guardia Patriarcale"
patriarchal_guard_flavor: 0 "#F I Patriarchi sono gli ultimi a conservare il sangue dell'Eroe; sarà da loro che egli farà ritorno, e pertanto devono essere protetti affinché la stirpe continui.#!"

bone_collectors: 0 "Raccoglitori di Ossa"
bone_collectors_flavor: 0 "#F Sebbene tutte e tre le città-fortezza delle Montagne delle Ossa affrontino minacce costanti, è a nord, lungo la Via delle Ossa, che i Kayakayanayani fronteggiano i pericoli maggiori. Eppure i loro guerrieri li affrontano tutti e raccolgono le ossa dei nemici per aggiungerle alle mura della città.#!"

stone_shields:0 "Scudi di Pietra"
stone_shields_flavor: 0 "#F La vita nelle Montagne delle Ossa è dura, e coloro che vivono lungo la Via di Pietra combattono le minacce provenienti da est e da ovest con grandi scudi che nessuno riesce a perforare.#!"

sand_couriers:0 "Corrieri della Sabbia"
sand_couriers_flavor: 0 "#F Lungo la grande Via della Sabbia, i Bayasabhadani fungono da intermediari tra l'estremo oriente e il resto di Essos. I loro corrieri affrontano ogni minaccia, che provenga dagli elementi, dalle bestie o dagli uomini.#!"

asa_scouts:0 "Esploratori Asa"
asa_scouts_flavor: 0 "#F I guerrieri di Asabhad sono celebri per i loro esploratori rapidi e silenziosi, che si dice attraversino montagne e giungle con la stessa facilità.#!"

pearl_phoenixes:0 "Fenici di Perla"
pearl_phoenixes_flavor: 0 "#F Proprio come le fiamme della fenice bruciano gli impuri e gli empi, così i quadrelli di questi soldati colpiscono coloro che intendono nuocere al loro signore.#!"

jade_dragons:0 "Draghi di Giada"
jade_dragons_flavor: 0 "#F Sotto la guida degli Imperatori Verde Mare, i marinai dei Feicui Ren dominarono il Mare di Giada e le acque oltre di esso. Si diceva che le loro navi fossero protette da draghi d'acqua.#!"

tourmaline_tortoises:0 "Tartarughe di Tormalina"
tourmaline_tortoises_flavor: 0 "#F Con l'Ombra a oriente, i Bixi Ren affrontano da lungo tempo razzie e altri attacchi. Proprio come grandi tartarughe, i loro soldati si equipaggiano con pesanti armature per respingere gli Uomini dell'Ombra.#!"

onyx_crows:0 "Corvi d'Onice"
onyx_crows_flavor: 0 "#F Nel nord di Yi Ti, al confine con le pianure dei Jogos N'hai, gli Heinao Ren difendono ferocemente l'Impero Dorato con picca e volontà.#!"

topaz_tigers:0 "Tigri di Topazio"
topaz_tigers_flavor: 0 "#F Le giungle centrali ospitano numerosi predatori, non ultimi le tigri che si aggirano in quelle terre. Eppure gli arcieri Haungyu Ren sono altrettanto pericolosi. Sono le Tigri di Topazio, e i loro artigli e morsi sono altrettanto letali.#!"

opal_cranes:0 "Gru d'Opale"
opal_cranes_flavor: 0 "#F Nelle pianure centrali di Yi Ti, la velocità rappresenta un grande vantaggio tanto in guerra quanto nel commercio. Per questo gli Aobao Ren combattono con una rapidità tale da rivaleggiare con le gru che riempiono i cieli.#!"

depth_killers:0 "Assassini degli Abissi"
depth_killers_flavor: 0 "#F I Lengii padroneggiano da lungo tempo l'arte della guerriglia, con la quale scacciarono l'Impero Dorato dalle proprie terre. Si dice che ogni nemico catturato vivo scompaia nelle profondità dell'isola.#!"

jade_sailors:0 "Marinai di Giada"
jade_sailors_flavor: 0 "#F La vita sul Mare di Giada è ricca di opportunità, ma c'è sempre qualcuno intenzionato a prendere anziché costruire. Per questo i marinai onesti viaggiano armati per proteggersi.#!"

poison_stings:0 "Pungiglioni Velenosi"
poison_stings_flavor: 0 "#F Persino tra i paradisi delle isole del Mare di Giada si celano dei pericoli. Spesso, l'insetto più bello possiede il pungiglione più letale.#!"

crescent_blades:0 "Lame Crescenti"
crescent_blades_flavor: 0 "#F Persino sull'Isola del Paradiso servono delle guardie. Le più valorose sono le Lame Crescenti, così chiamate per le lame a forma di luna che brandiscono.#!"

moraqi_elephants:0 "Elefanti Moraqi"
moraqi_elephants_flavor: 0 "#F Gli elefanti di Moraq sono famosi in ogni dove e vengono spesso offerti come doni e tributi. I più grandi e possenti non lasciano mai Grande Moraq; rimangono invece negli eserciti dei Moraqi, costituendo una forza possente e terribile.#!"

shans_herd:0 "Mandria dello Shan"
shans_herd_flavor: 0 "#F Sull'Isola degli Elefanti, dal suo palazzo d'avorio, lo Shan è protetto dagli elefanti più grandi e feroci del mondo conosciuto.#!"

blue_eyes:0 "Occhi Azzurri"
blue_eyes_flavor: 0 "#F I più pericolosi tra i Vahari sono quelli dagli occhi azzurri, poiché vengono addestrati senza tregua.#!"

stone_ranchers:0 "Mandriani di Pietra"
stone_ranchers_flavor: 0 "#F Proprio come allevatori e contadini sorvegliano le proprie mandrie, così i Mandriani di Pietra custodiscono e proteggono il Toro di Pietra e la sua mandria: il popolo Farosi.#!"

ash_wardens:0 "Custodi dell'Ash"
ash_wardens_flavor: 0 "#F l'Ash è la grande arteria avvelenata di Asshai e, talvolta, minacce provenienti dall'Ombra seguono il corso del fiume. I Guardiani dell'Ash devono affrontarle senza indugio.#!"

shadow_raiders:0 "Razziatori dell'Ombra"
shadow_raiders_flavor: 0 "#F Si dice che la vita sotto l'Ombra sia più dura che in qualsiasi altro luogo. Gli uomini che vi dimorano prosperano razziando i propri vicini, tanto all'interno quanto oltre l'Ombra.#!"

lions_of_night:0 "Leoni della Notte"
lions_of_night_flavor: 0 "#F Quando l'uomo tradì il patto con la Corte Celeste, il Leone della Notte scatenò i suoi demoni sui reami degli uomini. I più possenti tra essi assunsero la forma di grandi leoni e, ancora oggi, le genti oltre i Cinque Forti indossano armature forgiate a loro immagine.#!"

vassals_in_yellow:0 "Vassalli in Giallo"
vassals_in_yellow_flavor: 0 "#F Persino oltre i Cinque Forti, Carcosa si distingue dalle altre terre, più strana e avvolta dalle ombre. I suoi abitanti sono devoti al loro Imperatore Giallo e, armati di lunghe picche, minacciano chiunque li circondi.#!"

dream_questors:0 "Cercatori del Sogno"
dream_questors_flavor: 0 "#F Si dice che nella lontana K'Dath la vera grandezza possa essere trovata soltanto nei sogni, spesso mano nella mano con la follia. Questi uomini hanno seguito sussurri arcani e sono ormai guerrieri privi di paura.#!"

drainers:0 "Sanguisughe"
drainers_flavor: 0 "#F Oltre i Cinque Forti, le terre degli Uomini Senza Sangue sono temute in tutto il mondo. Si dice che chiunque vi si avventuri venga dissanguato fino all'ultima goccia.#!"

waste_raiders:0 "Razziatori delle Distese"
waste_raiders_flavor: 0 "#F Oltre i Cinque Forti, le distese grigie sono un luogo desolato e pericoloso. Per sopravvivere bisogna razziare amici e nemici senza distinzione.#!"

wind_demons:0 "Demoni del Vento"
wind_demons_flavor: 0 "#F Si dice che oltre i Cinque Forti gli uomini siano strani e mostruosi, e gli Uomini Alati non fanno eccezione. Certamente simili racconti non possono che essere metafore della loro velocità e abilità a cavallo.#!"

venom_bites:0 "Morsi Velenosi"
venom_bites_flavor: 0 "#F Gli Shryke provenienti da oltre i Cinque Forti colpiscono rapidamente e con il veleno, proprio come il morso di un serpente velenoso.#!"

 # Spawned Armies
  black_brothers:0 "Fratelli Neri"
  black_brothers_flavor:0 ""

 # Holy Order MaAs
shrikes:0 "Shrike"
shrikes_flavor: 0 "#F I sacerdoti del Dio Abissale hanno imbracciato le armi per scacciare eretici e blasfemi dalle Isole, proprio come fece l'Averla contro Harmund III.#!"

poorfellow_skirmishers:0 "Stelle dei Poveri Compagni"
poorfellow_skirmishers_flavor: 0 "#F Questi uomini e queste donne hanno consacrato la propria vita ai Poveri Compagni.#!"

warriors_sons_heavy_infantry:0 "Spade dei Figli del Guerriero"
warriors_sons_heavy_infantry_flavor: 0 "#F Questi cavalieri del Nobile e Potente Ordine dei Figli del Guerriero hanno scelto di combattere a piedi.#!"

warriors_sons_heavy_cav:0 "Cavalieri dei Figli del Guerriero"
warriors_sons_heavy_cav_flavor: 0 "#F Questi cavalieri del Nobile e Potente Ordine dei Figli del Guerriero hanno scelto di combattere a cavallo.#!"

  holy_guard:0 "Sacra Guardia dei Sacerdoti Barbuto"
holy_guard_flavor: 0 "#F Soldati schiavi dei Preti Barbuti, i membri della Guardia Sacra sono una forza temibile. Addestrati sin dalla giovinezza, brandiscono grandi asce al servizio dei sacerdoti e dei magistri di Norvos.#!"

  fiery_hand:0 "Mano Ardente di R'hllor"
fiery_hand_flavor: 0 "#F Soldati schiavi di R'hllor nelle Città Libere, la Mano Ardente è consacrata a compiere la volontà del Signore della Luce secondo gli ordini del Sommo Sacerdote di Volantis.#!"

  dothraki_screamers:0 "Urlatori Dothraki"
dothraki_screamers_flavor: 0 "#F Gli Urlatori Dothraki cavalcano senza armatura, armati soltanto dei loro arakh ricurvi e delle loro terrificanti grida. Rapidi come il vento e implacabili come il fuoco, piombano sui nemici con ferocia ineguagliabile. Udire le loro urla risuonare sulla pianura significa sapere che la morte galoppa nelle vicinanze.#!"

 # Innovation MaAs
  battering_ram:0 "Ariete d'Assedio"
battering_ram_flavor: 0 "#F Un ariete con cui abbattere i cancelli e le mura di qualsiasi nemico!#!"

knights_of_the_dragon:0 "Cavalieri del Drago"
knights_of_the_dragon_flavor: 0 "#F Man mano che i Valyriani hanno adottato gli usi di Westeros, i loro più grandi guerrieri hanno abbracciato le tradizioni della cavalleria. Rivestiti di terrificanti armature a piastre e ornati di draghi, questi cavalieri sono una forza terribile sul campo di battaglia.#!"

  northern_spears:0 "Lance di legno di ferro"
northern_spears_flavor: 0 "#F Armate di lance di legno di ferro, queste truppe del nord rappresentano una risposta letale ai cavalieri del sud.#!"

  dornish_crossbows:0 "Vipere di Dorne"
dornish_crossbows_flavor: 0 "#F Armati di balestre, questi uomini di Dorne sono rinomati per la loro precisione letale e per i quadrelli dalle punte avvelenate.#!"

  vale_heavy_infantry:0 "Guardia Insanguinata"
vale_heavy_infantry_flavor: 0 "#F Conosciuti per la difesa della Porta Insanguinata, questi spadaccini sono incrollabili nel proteggere la Valle.#!"

  crownlands_spears:0 "Lance del Crepuscolo"
crownlands_spears_flavor: 0 "#F Questi lancieri conoscono bene le terre attorno alla Baia delle Acque Nere e sono rinomati per la loro abilità nel combattere nelle città.#!"

  reach_light_cavalry:0 "Messaggeri della Mano"
reach_light_cavalry_flavor: 0 "#F Rapidi e leggeri, questi cavalieri d'avanscoperta possono attraversare l'intero Altopiano più velocemente di qualsiasi altra forza a cavallo, sia per recare messaggi sia per tormentare il nemico.#!"

  riverlands_light_infantry:0 "Barcaioli"
riverlands_light_infantry_flavor: 0 "#F Percorrendo il Tridente e i suoi numerosi affluenti in lungo e in largo, questi battellieri forniscono ai propri signori una forza di fanteria rapida e mobile.#!"

  westerlands_knights:0 "Cavalieri del Leone"
westerlands_knights_flavor: 0 "#F Forti e temprati, i cavalieri delle Terre dell'Ovest sono feroci quanto leoni.#!"

  stormlands_heavy_infantry:0 "Uomini dalle Corna"
stormlands_heavy_infantry_flavor: 0 "#F Corazzati e armati di freddo acciaio, questi uomini adornano i propri elmi con palchi di corna per mostrare la loro furia.#!"

  marcher_longbowmen:0 "Arcieri con Archi Lunghi"
marcher_longbowmen_flavor: 0 "#F Portando avanti l'orgogliosa tradizione delle Terre Basse di Dorne, questi combattenti brandiscono potenti archi lunghi per scompaginare le lente formazioni di fanteria.#!"

  westerosi_sellswords:0 "Mercenari Westerosi"
westerosi_sellswords_flavor: 0 "#F Molti cavalieri di Westeros trovano impiego nelle Compagnie Libere di Essos. Non possiedono tuttavia la stessa dedizione di coloro che hanno giurato fedeltà ai signori di Westeros, poiché la moneta non avrà mai la forza di un giuramento.#!"

  stepstone_sailors:0 "Pirati delle Stepstones"
stepstone_sailors_flavor: 0 "#F I pirati delle Stepstones sono una piaga sin dalla Frattura e continueranno a esserlo fino al ritorno della Lunga Notte.#!"

  giant_regiment:0 "Giganti"
giant_regiment_flavor: 0 "#F Alcuni dei celebri giganti dell'estremo nord, queste imponenti creature hanno deciso di combattere per una tribù proveniente da oltre la Bariera.#!"

  goldenheart_bowmen:0 "Balestrieri del Cuore Dorato"
goldenheart_bowmen_flavor: 0 "#F Le Isole dell'Estate e le loro navi-cigno sono temute da pirati e schiavisti, poiché vengono protette da reggimenti di Arcieri di Cuore d'Oro, i cui archi sono superati soltanto dai rarissimi archi d'osso di drago.#!"

  ruby_spearwomen:0 "Lanciatrici di Rubino"
ruby_spearwomen_flavor: 0 "#F Le temibili donne delle Montagne delle Ossa sono feroci e abilissime con le loro grandi lance, oltre a essere famose per i rubini e gli anelli di ferro che indossano.#!"

 # Title MaAs
  goldcloaks:0 "Mantelli d'Oro"
goldcloaks_flavor: 0 "#F La Guardia Cittadina di Approdo del Re, più tristemente nota come Cappe Dorate, è una forza da non sottovalutare. Equipaggiate con mantelli di lana tinti d'oro, corte lance, randelli, cotte di maglia nere e guanti neri, le Cappe Dorate sono riconoscibili in ogni angolo del reame.#!"

  sea_watch:0 "Guardia del Mare"
sea_watch_flavor: 0 "#F La Guardia del Mare del Trono di Spade è una forza navale incaricata di sorvegliare la Baia delle Acque Nere e le vie d'accesso alla città di Approdo del Re. È temuta dai contrabbandieri e mette a morte chiunque riesca a catturare.#!"

  redcloaks:0 "Mantelli Rossi"
redcloaks_flavor: 0 "#F La Guardia Cittadina di Lannisport, conosciuta anche come Cappe Rosse, è celebre per la propria efficienza e il proprio addestramento. Grazie alle ricchezze di Lannisport, i suoi uomini sono ben equipaggiati e sottoposti a una disciplina rigorosa.#!"

greycloaks:0 "Guardia del Selciato"
greycloaks_flavor: 0 "#F La Guardia Cittadina di Vecchia Città, conosciuta come Guardia del Selciato, è la più antica guardia cittadina di Westeros ed è rinomata per la propria professionalità e disciplina.#!"

  cailin_archers:0 "Arcieri di Cailin"
cailin_archers_flavor: 0 "#F Moat Cailin è la porta d'accesso al Nord e, grazie alla sua poderosa posizione al termine della strada rialzata e alla protezione offerta dall'Incollatura, gli arcieri possono difendere facilmente il castello — in rovina o ricostruito — contro qualsiasi nemico.#!"

grey_wolves:0 "Lupi Grigi"
grey_wolves_flavor: 0 "#F Con il Castello del Re Metamorfo nuovamente eretto, grandi guerrieri sono accorsi per assumere il nome di Gaven Greywolf e perpetuare l'eredità del Re Metamorfo.#!"

hammers_of_justice:0 "Martelli della Giustizia"
hammers_of_justice_flavor: 0 "#F Con Vecchie Pietre ricostruita, grandi guerrieri sono accorsi per assumere il nome di Tristifer Mudd e perpetuare l'eredità del Re dei Fiumi.#!"

morne_guardians:0 "Cavalieri Perfetti"
morne_guardians_flavor: 0 "#F Con Morne ricostruita, grandi guerrieri sono accorsi per assumere il nome di Ser Galladon e perpetuare l'eredità del Cavaliere Perfetto.#!"

dust_devils:0 "Diavoli di Polvere"
dust_devils_flavor: 0 "#F Con Hellgate Hall ricostruita, grandi guerrieri sono accorsi per assumere il nome di Lucifer Dryland e perpetuare l'eredità del Re dello Zolfo.#!"

head_collectors:0 "Raccoglitori di Teste"
head_collectors_flavor: 0 "#F Con i Sussurri ricostruiti, grandi guerrieri sono accorsi per assumere il nome di Clarence Crabb e perpetuare l'eredità del Cavaliere dell'Uro.#!"

cruel_chains:0 "Catene Crudeli"
cruel_chains_flavor: 0 "#F Con il Castello Hoare ricostruito, grandi guerrieri sono accorsi per assumere il nome di Qhored Hoare e perpetuare l'eredità del Crudele Re Supremo.#!"

bloody_blades:0 "Lame Insanguinate"
bloody_blades_flavor: 0 "#F Con la Fortezza Insanguinata nuovamente eretta, grandi guerrieri sono accorsi per assumere il nome di Brandon della Lama Insanguinata e perpetuare l'eredità della Lama Insanguinata.#!"

sharp_claws:0 "Artigli Affilati"
sharp_claws_flavor: 0 "#F Con Castamere ricostruita, grandi guerrieri sono accorsi per assumere il nome di Roger Reyne e perpetuare l'eredità del Leone Rosso.#!"

ursulas_screams:0 "Urla di Ursula"
ursulas_screams_flavor: 0 "#F Con la Fortezza del Tritone edificata, grandi guerrieri sono accorsi per assumere il nome di Ursula Upcliff e perpetuare l'eredità della Sposa del Tritone.#!"

wildling_cavalry:0 "Cavalieri dei Bruti"
wildling_cavalry_flavor: 0 "#F I Bruti fanno minor uso della cavalleria rispetto agli inginocchiati, affidandosi a una piccola e robusta razza di cavalli capace di sopravvivere al freddo e ai magri pascoli.#!"

 # Pirate MaAs
pirate_archers:0 "Uomini del Castello di Prua"
pirate_archers_flavor: 0 "#F Vedette assegnate al castello di prua, questi uomini sono armati di archi e sono i primi a versare sangue.#!"

pirate_pikemen:0 "Lunghi Ganci"
pirate_pikemen_flavor: 0 "#F Utilizzato per agganciare le navi nemiche, il lungo uncino è anche un'arma eccellente, soprattutto contro chiunque si trovi in sella a un cavallo.#!"

pirate_skirmishers:0 "Sciabole Nere"
pirate_skirmishers_flavor: 0 "#F Armati di sciabole e vestiti di nero, questi pirati abbatteranno chiunque osi frapporsi fra loro e il bottino.#!"

 # Night's Watch MaAs
  nw_rangers:0 "Esploratori"
nw_rangers_flavor: 0 "#F Principale forza combattente dei Guardiani della Notte, i ranger si avventurano regolarmente oltre la Bariera e affrontano i Bruti nella Foresta Stregata e nelle terre ancora più lontane.#!"

  nw_trackers:0 "Pistatori"
nw_trackers_flavor: 0 "#F Talvolta alcuni membri dei Guardiani della Notte vengono inviati molto lontano per rintracciare bersagli importanti o raccogliere informazioni cruciali. Poco numerosi, questi uomini sono tra i pochi a servirsi di cavalli.#!"

  sworn_brothers:0 "Fratelli Giurati"
sworn_brothers_flavor: 0 "#F Sebbene il loro numero sia assai diminuito rispetto al passato, i fratelli giurati rimangono una forza da non sottovalutare — soprattutto se paragonati ai Bruti oltre la Bariera.#!"

  shadow_spears:0 "Lance d'Ombra"
shadow_spears_flavor: 0 "#F Gli uomini della Torre delle Ombre sorvegliano da lungo tempo il Ponte dei Teschi. Per tenere lontani i nemici da un passaggio tanto cruciale, hanno perfezionato l'uso delle lunghe lance.#!"

  eastwatch_sailors:0 "Marinai di Eastwatch-by-the-Sea"
eastwatch_sailors_flavor: 0 "#F Essendo l'unico porto dei Guardiani della Notte, i fratelli di Guardia Orientale sul Mare sono abili marinai, avvezzi a pattugliare il Mare dei Brividi.#!"

 # Dragons
  anti_dragon:0 "[anti_dragon_maa|E]"
  scorpions:0 "Scorpioni"
scorpions_flavor: 0 "#F Una grande macchina lanciatrice di dardi, capace di perforare persino le armature più spesse. Sebbene surclassato nella guerra tradizionale, lo scorpione non ha eguali sotto un aspetto: la capacità di trapassare le scaglie dei draghi.#!"

  water_wizards:0 "Maghi delle Acque"
water_wizards_flavor: 0 "#F I Rhoynar erano celebri per il loro legame con il grande fiume, venerato come Dea Madre. Tale culto trova la sua più potente manifestazione nei Maghi dell'Acqua, capaci di brandire il corpo stesso della Madre per abbattere persino i draghi.#!"

  dragons_regiment:0 "[dragons_plural|E]"
dragons_flavor: 0 "#F I draghi sono l'arma più temibile al mondo, capaci di ridurre interi eserciti in cenere. Affrontarne uno significa contemplare il volto stesso della morte.#!"

 #Special

laamp_settler_maa:0 "Coloni"
laamp_settler_maa_flavor: 0 "#F Ben lontani dall'essere veri soldati, i coloni sono un'accozzaglia di individui in cerca di un nuovo inizio. Possono essere trovati in qualsiasi possedimento, pronti a unirsi a qualunque [adventurer|E] disponga di spazio nel proprio #V Convoglio dei Coloni#! [building|E].#!"

