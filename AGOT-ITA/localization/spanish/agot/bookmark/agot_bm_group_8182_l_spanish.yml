l_spanish:
agot_bm_group_8182: 0 "182 D.C."
agot_bm_8182: 0 "Le Campane della Guerra"
agot_bm_8182_desc: 0 "Il conflitto ha travolto il Rhoyne e i suoi affluenti. A Lorath, il Primo Magistro Thys O’rel cerca di proseguire i propri successi militari dopo la vittoriosa guerra contro Norvos, ma il suo prossimo obiettivo — la colonia ibbenese nell'Ascia — potrebbe rivelarsi più gravoso del previsto.\n\nNel frattempo, a Qohor è scoppiata un'accesa contesa elettorale tra Haratt Ekna — che intende punire Norvos per le trasgressioni della città — e Korena Ostorlat — convinta che Norvos e Qohor rappresentino l'unica speranza contro il giovane conquistatore di Lorath.\n\nA sud, il Governatore volanteno di Gar Sagon si è rivoltato contro i suoi alleati rhoynar guidati da Asuhara Arhe Meali, conducendo una guerra per la sopravvivenza contro coloro sui quali un tempo faceva affidamento.\n\n#bold Mentre il caos della battaglia si gonfia in un tetro coro, il mondo scoprirà per chi suonano le campane di guerra.#!"

bookmark_182_thys_o_rell: 0 "Primo Magistro Thys"
bookmark_182_thys_o_rell_subheading: 0 "Primo Magistro di Lorath"
bookmark_182_thys_o_rell_desc: 0 "[Concept( 'story_content_thys_o_rell_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_thys_o_rell_182', '$bm_story_content_available_copy|q$' )|E]\nIl giovane condottiero di Lorath si è fatto un nome sconfiggendo Norvos in battaglia due anni e mezzo fa. Come un vero conquistatore — o forse un comandante troppo ambizioso — Thys ha rivolto lo sguardo verso l'Ascia. #bold Ma ora che l'ultima campagna si sta trasformando in una guerra di logoramento, le ambizioni dei Lorathi lasceranno la Città Libera vulnerabile a coloro che hanno disprezzato?#!"

bookmark_182_korena_ostorlat: 0 "Magistro Korena"
bookmark_182_korena_ostorlat_subheading: 0 "Magistro di Grjevuros"
bookmark_182_korena_ostorlat_desc: 0 "[Concept( 'story_content_korena_ostorlat_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_korena_ostorlat_182', '$bm_story_content_available_copy|q$' )|E]\nKorena Ostorlat si è affermata come candidata filo-norvoshi in un'accesa elezione a Qohor. Il suo ragionamento è semplice: il giovane Primo Magistro di Lorath rappresenta una minaccia diretta per la regione — e può essere fermato soltanto da un'alleanza tra Qohor e Norvos. #bold Prima di poter affrontare la minaccia di Lorath, Korena deve però vincere l'elezione che suggellerà il suo destino.#!"
 
bookmark_182_haratt_ekna: 0 "Magistro Haratt"
bookmark_182_haratt_ekna_subheading: 0 "Magistro di Erodhunavar"
bookmark_182_haratt_ekna_desc: 0 "[Concept( 'story_content_haratt_ekna_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_haratt_ekna_182', '$bm_story_content_available_copy|q$' )|E]\nHaratt Ekna non è soltanto uno dei principali candidati alle imminenti elezioni qohorik, ma anche il più agguerrito oppositore dei bellicosi Norvoshi. Ha sostenuto, spesso a gran voce, che Norvos debba rispondere dei numerosi crimini commessi contro Qohor. #bold Se Haratt dovesse diventare Primo Magistro, le campane di guerra torneranno certamente a suonare.#!"

bookmark_182_krahas_segal: 0 "Governatore Krahas"
bookmark_182_krahas_segal_subheading: 0 "Governatore di Gar Sagon"
bookmark_182_krahas_segal_desc: 0 "[Concept( 'story_content_krahas_segal_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_krahas_segal_182', '$bm_story_content_available_copy|q$' )|E]\nKrahas Segal detiene il dominio strategico di Gar Sagon, conquistato dai Volanteni grazie a un'alleanza con la Confederazione Rhoynar. Ora, però, queste terre sono divenute oggetto di un'aspra contesa, poiché Krahas ha tradito i suoi antichi alleati e cerca di annientarli completamente. #bold Riuscirà il suo piano, disperdendo i Rhoynar come un'onda che si infrange contro una rupe?#!"

bookmark_182_arhe_meali: 0 "Lady Asuhara"
bookmark_182_arhe_meali_subheading: 0 "Lady di Pihu Sar"
bookmark_182_arhe_meali_desc: 0 "[Concept( 'story_content_arhe_meali_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_arhe_meali_182', '$bm_story_content_available_copy|q$' )|E]\nAsuhara Arhe Meali è la feroce guida della Confederazione Rhoynar. Un tempo alleati indispensabili dei Volanteni, lei e i suoi confederati sono stati traditi e ora affrontano una minaccia esistenziale proveniente dalla stessa fortezza che un tempo contribuirono a conquistare: Gar Sagon. #bold Di fronte al tradimento e alla prospettiva dell'esilio, riuscirà Asuhara a radunare la Confederazione e condurla alla vittoria?#!"
