 # Gene Values
 # Dragonfire
dragon_fire_color_template_de_gui: 0 "Modalità Colore del Fuoco"
dragon_fire_color_template_de_gui_tt: 0 "#bold Predefinito#! adatta la fiamma alla colorazione del tuo drago.\n\n#bold Personalizzato#! ti permette di scegliere la colorazione della fiamma tramite un cursore."
dragon_fire_color_value_de_gui: 0 "Colore del Fuoco"
dragon_fire_color_value_de_gui_tt: 0 "Con #bold Predefinito#!, la percentuale indica quanto #emp intensamente#! la fiamma assume la colorazione del tuo drago — allo 0% la fiamma avrà il suo naturale colore arancione.\n\nCon #bold Personalizzato#!, la percentuale rappresenta #emp il colore stesso#! lungo un giro completo della ruota cromatica — sia allo 0% sia al 100% il colore sarà arancione naturale, mentre al 50% sarà blu.\n\nIl colore è più intenso presso la bocca e sfuma gradualmente verso il colore naturale della fiamma lungo la scia."
dragon_fire_smoke_template_de_gui: 0 "Modalità Fumo"
dragon_fire_smoke_template_de_gui_tt: 0 "#bold Automatico#! mostra il fumo soltanto su un drago scuro, dove appare naturale.\n\n#bold Personalizzato#! ti permette di regolare tramite un cursore la quantità di fumo su qualsiasi drago."
dragon_fire_smoke_value_de_gui: 0 "Fumo"
dragon_fire_smoke_value_de_gui_tt: 0 "Con #bold Automatico#!, questo cursore viene #emp ignorato#!, producendo un fumo più denso per i draghi più scuri.\n\nCon #bold Personalizzato#!, la percentuale indica #emp quanto#! fumo si leva dalla fiamma — nessuno allo 0% e il massimo al 100%."
